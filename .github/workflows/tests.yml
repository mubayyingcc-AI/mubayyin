name: tests

on:
  push:
  pull_request:

jobs:
  core-engine-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API and test dependencies
        run: python3 -m pip install -r requirements.txt
      - name: Run engine, API, and public website tests
        run: python3 -m unittest discover -s tests -v
      - name: Run demo end-to-end smoke test
        run: python3 demo.py
      - name: Run Qatar bilingual PoC acceptance demo
        run: PYTHONPATH=. python3 scripts/run_qatar_poc.py
