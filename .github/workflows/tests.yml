name: tests

on:
  push:
  pull_request:

jobs:
  core-engine-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mubayyin_test
          POSTGRES_PASSWORD: mubayyin_test_password
          POSTGRES_DB: mubayyin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mubayyin_test -d mubayyin_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MUBAYYIN_TEST_DATABASE_URL: postgresql+psycopg://mubayyin_test:mubayyin_test_password@localhost:5432/mubayyin_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API and test dependencies
        run: python3 -m pip install -r requirements.txt
      - name: Run engine, API, PostgreSQL persistence, and public website tests
        run: python3 -m unittest discover -s tests -v
      - name: Run demo end-to-end smoke test
        run: python3 demo.py
      - name: Run Qatar bilingual PoC acceptance demo
        run: PYTHONPATH=. python3 scripts/run_qatar_poc.py
