name: tests

on:
  push:
  pull_request:

jobs:
  core-engine-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run core engine test suite (zero external dependencies)
        run: python3 -m unittest tests.test_engine -v
      - name: Run demo end-to-end smoke test
        run: python3 demo.py
